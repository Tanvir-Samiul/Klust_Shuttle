<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — CampusShuttle · KLUST</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: {
                950: "#0A1628",
                900: "#0F1E37",
                800: "#16294A",
                700: "#1F3763",
              },
              cream: "#F5F1EA",
              muted: "#8FA3BF",
              routeA: "#C9A227",
              routeB: "#A9744F",
              brown: {
                500: "#A9744F",
                600: "#8B5E3C",
                700: "#6F4728",
              },
            },
            fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] },
            boxShadow: {
              glass: "0 20px 60px -20px rgba(0,0,0,0.6)",
              glow: "0 0 40px -10px rgba(201,162,39,0.35)",
            },
          },
        },
      };
    </script>

    <!-- Leaflet -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body class="min-h-screen bg-navy-950 font-sans text-cream">
    <!-- Full-screen map -->
    <div id="map" class="fixed inset-0 z-0 overflow-hidden"></div>
    <div class="fixed inset-0 z-10 pointer-events-none bg-navy-950/40"></div>

    <!-- Top-left brand -->
    <div
      class="absolute top-4 left-4 sm:top-6 sm:left-6 z-30 flex items-center gap-3 sm:gap-4"
    >
      <div
        class="w-12 h-12 sm:w-16 sm:h-16 rounded-xl sm:rounded-2xl bg-white/95 flex items-center justify-center shadow-glow overflow-hidden p-1.5 sm:p-2"
      >
        <img
          src="assets/img/klust-logo.png"
          alt="KLUST"
          class="w-full h-full object-contain"
          onerror="
            this.style.display = 'none';
            this.parentElement.innerHTML =
              '<span class=\'text-navy-950 font-extrabold text-xl sm:text-2xl\'>K</span>';
          "
        />
      </div>
      <div>
        <h1
          class="font-extrabold text-lg sm:text-xl leading-tight tracking-tight"
        >
          CampusShuttle
        </h1>
        <p class="text-[10px] sm:text-xs text-muted leading-tight mt-0.5">
          KLUST Fleet Management
        </p>
      </div>
    </div>

    <!-- Top-right live badge -->
    <div
      class="absolute top-4 right-4 sm:top-6 sm:right-6 z-30 hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-navy-900/70 backdrop-blur-md border border-white/10"
    >
      <span class="relative flex w-2 h-2">
        <span
          class="animate-ping absolute inline-flex h-full w-full rounded-full bg-routeA opacity-75"
        ></span>
        <span
          class="relative inline-flex rounded-full h-2 w-2 bg-routeA"
        ></span>
      </span>
      <span class="text-xs font-semibold text-cream/90"
        >Live · 2 buses running</span
      >
    </div>

    <!-- Bottom-left legend -->
    <div
      class="hidden lg:block absolute bottom-6 left-6 z-30 bg-navy-900/60 backdrop-blur-md border border-white/10 rounded-2xl p-4 min-w-[250px]"
    >
      <p
        class="text-[10px] uppercase tracking-widest text-muted font-bold mb-3"
      >
        Active Routes
      </p>
      <div class="space-y-3">
        <div class="flex items-start gap-3">
          <span
            class="mt-1 w-3 h-3 rounded-full bg-routeA shadow-[0_0_12px_#C9A227]"
          ></span>
          <div>
            <p class="text-xs font-semibold text-cream">
              MRT Serdang Jaya → KLUST
            </p>
            <p class="text-[10px] text-muted">ETA 12 min · Bus BUS-07</p>
          </div>
        </div>
        <div class="flex items-start gap-3">
          <span
            class="mt-1 w-3 h-3 rounded-full bg-routeB shadow-[0_0_12px_#A9744F]"
          ></span>
          <div>
            <p class="text-xs font-semibold text-cream">
              IOI City Mall → KLUST
            </p>
            <p class="text-[10px] text-muted">ETA 15 min · Bus BUS-12</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Login panel -->
    <main
      class="relative z-20 min-h-screen w-full flex items-center justify-center lg:justify-end px-3 sm:px-6 py-4 sm:py-10 lg:pr-16"
    >
      <div
        class="w-full max-w-md bg-navy-900/40 backdrop-blur-2xl border border-white/10 rounded-3xl p-6 sm:p-8 lg:p-10 shadow-glass animate-card-in"
      >
        <!-- KLUST logo strip -->

        <!-- Header -->

        <!-- Role tabs -->
        <div class="stagger-item">
          <div
            id="roleTabs"
            class="relative grid grid-cols-3 p-1 rounded-2xl bg-navy-950/40 border border-white/10 backdrop-blur-md"
          >
            <div
              id="rolePill"
              class="absolute top-1 bottom-1 left-1 rounded-xl bg-gradient-to-br from-brown-500 to-brown-600 shadow-glow transition-transform duration-300 ease-out"
              style="width: calc((100% - 0.5rem) / 3)"
            ></div>
            <button
              data-role="student"
              class="role-tab relative z-10 py-2.5 text-xs sm:text-sm font-semibold rounded-xl transition-colors"
            >
              Student
            </button>
            <button
              data-role="driver"
              class="role-tab relative z-10 py-2.5 text-xs sm:text-sm font-semibold rounded-xl transition-colors"
            >
              Driver
            </button>
            <button
              data-role="admin"
              class="role-tab relative z-10 py-2.5 text-xs sm:text-sm font-semibold rounded-xl transition-colors"
            >
              Admin
            </button>
          </div>
        </div>

        <!-- Form -->
        <form
          id="loginForm"
          class="mt-6 sm:mt-7 space-y-4 sm:space-y-5 stagger-item"
          novalidate
        >
          <div class="relative">
            <input
              id="userId"
              name="userId"
              type="text"
              autocomplete="username"
              placeholder=" "
              class="peer w-full px-4 pt-6 pb-2 rounded-xl bg-navy-950/40 border border-white/10 text-cream placeholder-transparent focus:outline-none focus:border-routeA/60 focus:ring-2 focus:ring-routeA/30 transition"
              required
            />
            <label
              for="userId"
              id="userIdLabel"
              class="absolute left-4 top-2 text-[11px] font-semibold text-muted uppercase tracking-wider transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-sm peer-placeholder-shown:normal-case peer-placeholder-shown:tracking-normal peer-focus:top-2 peer-focus:text-[11px] peer-focus:uppercase peer-focus:tracking-wider peer-focus:text-routeA"
            >
              KLUST Student ID
            </label>
          </div>

          <div class="relative">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder=" "
              class="peer w-full px-4 pt-6 pb-2 pr-16 rounded-xl bg-navy-950/40 border border-white/10 text-cream placeholder-transparent focus:outline-none focus:border-routeA/60 focus:ring-2 focus:ring-routeA/30 transition"
              required
            />
            <label
              for="password"
              class="absolute left-4 top-2 text-[11px] font-semibold text-muted uppercase tracking-wider transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-sm peer-placeholder-shown:normal-case peer-placeholder-shown:tracking-normal peer-focus:top-2 peer-focus:text-[11px] peer-focus:uppercase peer-focus:tracking-wider peer-focus:text-routeA"
            >
              Password
            </label>
            <button
              type="button"
              id="togglePw"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-semibold text-muted hover:text-cream transition"
            >
              Show
            </button>
          </div>

          <div class="flex items-center justify-between">
            <label
              class="flex items-center gap-2 text-xs text-muted select-none cursor-pointer"
            >
              <input
                type="checkbox"
                class="w-4 h-4 rounded border-white/20 bg-navy-950/40 text-brown-500 focus:ring-routeA/30"
              />
              Keep me signed in
            </label>
            <a
              href="#"
              class="text-xs font-semibold text-routeA hover:underline"
              >Forgot password?</a
            >
          </div>

          <div
            id="errorBox"
            class="hidden text-sm text-[#F5C2B6] bg-[#3A1F1B]/60 border border-[#E07A5F]/40 rounded-xl px-3 py-2.5 animate-shake"
          ></div>

          <button
            type="submit"
            id="loginBtn"
            class="relative w-full py-3.5 rounded-xl bg-gradient-to-br from-brown-500 to-brown-600 text-white font-semibold hover:from-brown-500/90 hover:to-brown-600/90 focus:ring-4 focus:ring-routeA/20 transition disabled:opacity-60 disabled:cursor-not-allowed overflow-hidden"
          >
            <span id="btnText" class="relative z-10">Sign in</span>
            <span
              id="btnSpinner"
              class="hidden absolute inset-0 z-10 flex items-center justify-center"
            >
              <svg
                class="animate-spin h-5 w-5 text-white"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
                ></path>
              </svg>
            </span>
          </button>
        </form>

        <!-- Demo credentials -->

        <p class="mt-4 sm:mt-6 text-xs text-center text-muted stagger-item">
          New student?
          <a href="#" class="font-semibold text-routeA hover:underline"
            >Register with your KLUST ID</a
          >
        </p>
      </div>
    </main>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/map.js"></script>
    <script src="assets/js/auth.js"></script>
  </body>
</html>
